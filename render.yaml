# Render Blueprint for IndigoMart Backend
# https://render.com/docs/blueprint-spec
#
# NOTE: Only the backend API is deployed to Render.
# The frontend is deployed on Vercel (see frontend/vercel.json).

services:
  # Backend API
  - type: web
    name: indigomart-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://indigomart.vercel.app,http://localhost:5173
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://indigomart.vercel.app/reset-password
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: IndigoMart <no-reply@indigomart.com>
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DELHIVERY_API_KEY
        sync: false
      - key: QR_UPI_ID
        sync: false
      - key: QR_PAYEE_NAME
        value: IndigoMart
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: indigomart_products
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: 1536
      - key: ENABLE_SEMANTIC_SEARCH
        value: false
      - key: QUERY_EXPANSION_ENABLED
        value: false