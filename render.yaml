# Render Blueprint for IndigoMart
# https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: indigomart-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://indigomart-frontend.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://indigomart-frontend.onrender.com/reset-password
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: IndigoMart <no-reply@indigomart.com>
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DELHIVERY_API_KEY
        sync: false
      - key: QR_UPI_ID
        sync: false
      - key: QR_PAYEE_NAME
        value: IndigoMart

  # Frontend
  - type: web
    name: indigomart-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://indigomart-api.onrender.com